[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muesli-glee-agent"
version = "0.1.0"
description = "MUESLI: a structural planning agent for the GLEE Competition"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Harrison Oates" }]
dependencies = ["glee-sdk>=0.0.5,<0.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
muesli-glee = "muesli_agent.cli:main"
muesli-glee-export = "muesli_agent.telemetry:export_main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
